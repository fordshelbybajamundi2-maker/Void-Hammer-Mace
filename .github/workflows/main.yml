
name: Build Void Mace Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract mod source
        run: |
          unzip -o VoidMace-source.zip -d source
          echo "Files extracted:"
          find source -maxdepth 3 -type f | head -80

      - name: Build mod
        run: |
          cd source
          GRADLE_FILE=$(find . -name gradlew -type f | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: No Gradle wrapper found in the ZIP."
            exit 1
          fi
          chmod +x "$GRADLE_FILE"
          cd "$(dirname "$GRADLE_FILE")"
          ./gradlew build

      - name: Upload JAR files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoidMace-build
          path: |
            source/**/*.jar
            source/**/build/reports/**
          if-no-files-found: warn
